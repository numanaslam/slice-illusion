# BraTS run for the multi-dataset aggregation (s11/s12) — puts BraTS in the SAME
# forest as the MedMNIST CT sets, with the identical panel + operator. Points
# paths.results at experiments/results so its row merges with the MedMNIST rows.
seed: 42

paths:
  raw: data/raw
  processed: data/processed        # the paper's BraTS processed dir ({train,eval,heldout})
  concepts: data/concepts
  results: experiments/results     # SHARED with medmnist -> one combined multidataset.csv

data:
  dataset: brats
  root: data/raw/Task01_BrainTumour
  num_channels: 4                  # BraTS: T1, T1ce, T2, FLAIR
  vol_size: [96, 96, 96]
  num_workers: 0

model:
  source: checkpoint
  arch: resnet                     # matches the paper's main model
  bottleneck: enc3
  num_classes: 2

svox:
  num_supervoxels: 300
  compactness: 0.1

faith:
  surrogate: context-nn
  feather_sigma: 2.0
  steps: 20
  slice_band: 1

compute:
  device: cuda
  amp: true

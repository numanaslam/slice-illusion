# LIDC-IDRI (chest CT) — generality axis #2. Single-channel CT, nodule-crop unit.
seed: 42

paths:
  raw: data/raw
  processed: data/processed_lidc      # separate from BraTS so the two don't mix
  concepts: data/concepts_lidc
  results: experiments/results_lidc

data:
  dataset: LIDC
  root: data/raw/LIDC-IDRI            # only used if you convert to NIfTI; pylidc uses ~/.pylidcrc
  num_channels: 1                     # CT is single-channel
  vol_size: [96, 96, 96]
  num_workers: 0

model:
  arch: reference                     # run BOTH arch: reference and arch: resnet here too
  source: checkpoint                  # backbone_<arch>.pt under processed_lidc
  bottleneck: enc3
  num_classes: 2

tcav:
  num_random_sets: 20
  neg_per_set: 200
  classifier: logistic
  aggregate: mean
  alpha_sig: 0.01

svox:
  num_supervoxels: 300
  compactness: 0.1

cbm:
  l1: 1.0e-3
  max_epochs: 50
  lr: 0.05

faith:
  surrogate: context-nn
  feather_sigma: 2.0
  steps: 10
  slice_band: 1

compute:
  device: cuda
  amp: true

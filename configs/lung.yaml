# MSD Task06_Lung (chest CT) — dataset generality axis. Single-channel CT.
seed: 42

paths:
  raw: data/raw
  processed: data/processed_lung       # separate from BraTS so the two don't mix
  concepts: data/concepts_lung
  results: experiments/results_lung

data:
  dataset: LUNG
  root: data/raw/Task06_Lung
  num_channels: 1                      # CT is single-channel
  vol_size: [96, 96, 96]
  num_workers: 0

model:
  arch: reference                      # run BOTH reference and resnet here too
  source: checkpoint                   # auto-resolves to backbone_<arch>.pt under processed_lung
  bottleneck: enc3
  num_classes: 2

tcav:
  num_random_sets: 20
  neg_per_set: 200
  classifier: logistic
  aggregate: mean
  alpha_sig: 0.01

svox:
  num_supervoxels: 300
  compactness: 0.1

cbm:
  l1: 1.0e-3
  max_epochs: 50
  lr: 0.05

faith:
  surrogate: context-nn
  feather_sigma: 2.0
  steps: 10
  slice_band: 1

compute:
  device: cuda
  amp: true

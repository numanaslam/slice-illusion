# VCF3D config tuned for an 8 GB GPU (RTX 3070). Use with:
#   python -m scripts.s03_train_cavs --config configs/rtx3070.yaml
seed: 42

paths:
  raw: data/raw
  processed: data/processed
  concepts: data/concepts
  results: experiments/results

data:
  dataset: BraTS
  root: data/raw/Task01_BrainTumour
  num_channels: 4
  vol_size: [96, 96, 96]     # 8 GB-safe. Drop to [64,64,64] if you still OOM.
  cache_rate: 0.0            # don't cache volumes in RAM/VRAM
  num_workers: 0             # Windows spawn-safe

model:
  arch: reference           # reference (plain CNN) | resnet (residual) — 2nd family
  source: checkpoint        # checkpoint loads backbone_<arch>.pt; 'reference' = random init
  # checkpoint path auto-resolves to data/processed/backbone_<arch>.pt
  bottleneck: enc3          # NOT enc4: enc4 sits right before GAP+linear, making
                            # d(logit)/d(activation) spatially uniform & input-
                            # independent -> degenerate TCAV. enc3 has a maxpool +
                            # conv-BN-ReLU downstream, so sensitivity is meaningful.
  num_classes: 2

tcav:
  num_random_sets: 20
  neg_per_set: 200
  classifier: logistic
  aggregate: mean
  alpha_sig: 0.01

svox:
  num_supervoxels: 300       # slightly fewer supervoxels at 96^3
  compactness: 0.1

cbm:
  l1: 1.0e-3
  max_epochs: 50
  lr: 0.05

faith:
  surrogate: context-nn
  feather_sigma: 2.0
  steps: 20
  slice_band: 1             # slice-wise band width K. 1 = strict per-slice (2D);
                            # sweep {1,4,16,96} to show discriminability needs 3D context

compute:
  device: cuda
  amp: true                  # mixed precision — important on 8 GB

name: vcf3d
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # torch pinned to the cu121 wheel; change to cu118 if your driver is older
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.4.1
      - torchvision==0.19.1
      - monai==1.4.0
      - nibabel==5.2.1
      - scikit-image==0.24.0     # 3D SLIC supervoxels
      - scikit-learn==1.5.2      # CAV linear classifier, kmeans, GMM
      - scipy==1.14.1
      - numpy==1.26.4
      - einops==0.8.0
      - pyyaml==6.0.2
      - tqdm==4.66.5
      - pandas==2.2.3
      - matplotlib==3.9.2
      - tensorboard==2.17.1
      - pytest==8.3.3
      - synapseclient==4.4.1     # BraTS download (optional)
      - huggingface_hub==0.25.1  # CT-RATE download (optional)
